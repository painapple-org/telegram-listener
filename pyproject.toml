[project]
name = "telegram-listener"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # getUpdates/getFile/sendMessage/sendDocument calls to a self-hosted
    # local telegram-bot-api server (see installer/docker-compose.yml) are
    # plain HTTP - requests is the simplest thing that also does multipart
    # file uploads (sendDocument) without hand-rolling MIME encoding.
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

# The example plugin under plugins/claude_agent.py is the ONE thing in this
# repo that depends on claude-agent-sdk - the core listener never imports
# it. Installing it is opt-in via this extra, not a core dependency, so a
# consumer who writes their own dispatch plugin never pulls it in.
[project.optional-dependencies]
claude-agent-plugin = [
    "claude-agent-sdk>=0.2.129",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["telegram_listener", "plugins"]
